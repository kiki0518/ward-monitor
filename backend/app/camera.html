<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera 即時監看</title>
<style>
  :root { color-scheme: dark; font: 16px system-ui, sans-serif; }
  body { margin: 0; background: #101820; color: #eef4f8; }
  main { max-width: 1000px; margin: 0 auto; padding: 32px 20px; }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-size: 24px; } p { color: #aabecb; line-height: 1.6; }
  #status { border-radius: 20px; padding: 8px 14px; background: #243746; }
  #screen { aspect-ratio: 4/3; background: #070d12; border: 1px solid #314756; border-radius: 16px; display: grid; place-items: center; overflow: hidden; margin-top: 20px; }
  #screen > * { grid-area: 1 / 1; }
  img { width: 100%; height: 100%; object-fit: contain; }
  [hidden] { display: none !important; }
  button { color: inherit; background: #243746; border: 1px solid #617788; padding: 10px 18px; border-radius: 8px; cursor: pointer; }
</style>
<main>
  <header><h1>Camera 即時監看</h1><span id="status" role="status" aria-live="polite">連線中…</span></header>
  <div id="screen"><p id="placeholder">等待攝影機影像</p><img id="frame" alt="攝影機即時影像" hidden></div>
  <p id="details">尚未收到影像</p>
  <button id="reconnect" type="button">重新連線</button>
</main>
<script>
const picture = document.querySelector('#frame');
const status = document.querySelector('#status');
const details = document.querySelector('#details');
const placeholder = document.querySelector('#placeholder');
let socket, retryTimer, lastFrame = 0, frames = 0, intervalStart = performance.now();
function waiting(text) {
  picture.hidden = true; placeholder.hidden = false; status.textContent = text;
  details.textContent = '尚未收到新影像';
}
function connect() {
  clearTimeout(retryTimer);
  if (socket) { socket.onclose = null; socket.close(); }
  waiting('連線中…'); lastFrame = 0; frames = 0; intervalStart = performance.now();
  const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}/ws/camera/view`);
  socket = ws;
  ws.binaryType = 'blob';
  const next = () => { if (socket === ws && ws.readyState === WebSocket.OPEN) ws.send('next'); };
  ws.onopen = next;
  ws.onmessage = async event => {
    if (socket !== ws) return;
    if (typeof event.data === 'string') {
      const message = JSON.parse(event.data);
      if (message.status === 'waiting') waiting('等待攝影機');
      next(); return;
    }
    const url = URL.createObjectURL(event.data);
    try {
      picture.src = url;
      await picture.decode();
      if (socket !== ws || ws.readyState !== WebSocket.OPEN) return;
      picture.hidden = false; placeholder.hidden = true; status.textContent = '即時影像';
      lastFrame = performance.now(); frames++;
      const elapsed = (lastFrame - intervalStart) / 1000;
      if (elapsed >= 1) {
        details.textContent = `${picture.naturalWidth} × ${picture.naturalHeight} · 接收 ${(frames / elapsed).toFixed(1)} FPS · 最近一張 ${(event.data.size / 1024).toFixed(0)} KB`;
        frames = 0; intervalStart = lastFrame;
      }
    } catch { if (socket === ws) waiting('影像解碼失敗'); }
    finally { URL.revokeObjectURL(url); }
    next();
  };
  ws.onerror = () => ws.close();
  ws.onclose = () => {
    if (socket !== ws) return;
    waiting('連線中斷，正在重試…'); retryTimer = setTimeout(connect, 2000);
  };
}
setInterval(() => {
  if (lastFrame && performance.now() - lastFrame > 3000) waiting('影像中斷，等待新畫面');
}, 1000);
document.querySelector('#reconnect').onclick = connect;
connect();
</script>
</html>
