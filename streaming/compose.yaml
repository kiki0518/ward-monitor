services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.0
    restart: unless-stopped
    environment:
      MTX_WEBRTCADDITIONALHOSTS: "${SERVER_IP:?Set SERVER_IP to the server LAN IP}"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8554:8554/tcp"
      - "8889:8889/tcp"
      - "8189:8189/udp"
